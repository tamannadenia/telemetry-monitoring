version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: telemetry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telemetry_monitoring
    ports:
      - "5432:5432"
    volumes:
      - telemetry_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telemetry_monitoring"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  telemetry_pg_data:
